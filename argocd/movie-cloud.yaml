apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: movie-cloud
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/byron-movie-cloud/gitops.git
      targetRevision: HEAD
      path: charts/movie-cloud
      helm:
        valueFiles:
          - $values/values-production.yaml
        values: |
          imagePullSecrets:
            - name: ghcr-pull-secret
          services:
            movie:
              image:
                tag: 0d886206ad98dc3f4088536abccb23bc86d8c7a1
          ingress:
            host: a37a8e75e89eb43498f8a939d214fe50-398867677.eu-north-1.elb.amazonaws.com
    - repoURL: https://github.com/byron-movie-cloud/gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: movie-cloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
