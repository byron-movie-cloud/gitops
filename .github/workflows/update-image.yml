name: Update deployed image version

on:
  repository_dispatch:
    types: [update-image]

permissions:
  contents: write

jobs:
  update-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install updater dependencies
        run: python -m pip install -r requirements.txt
      - name: Update production image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_COMPONENT: ${{ github.event.client_payload.component }}
          IMAGE_TAG: ${{ github.event.client_payload.tag }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .github/scripts/update_image_version.py
